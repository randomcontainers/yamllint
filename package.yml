name: yamllint
title: yamllint
summary: Checks YAML files for syntax errors, duplicate keys and formatting problems such as indentation, line length and trailing spaces.
homepage: https://github.com/adrienverge/yamllint
# yamllint, the Python packages installed with it, pip and the packages it
# vendors, and libyaml, which is linked statically into PyYAML (see licenses/).
license: GPL-3.0-or-later AND MIT AND MPL-2.0 AND Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND ISC AND PSF-2.0
upstream:
  source: pypi
  project: yamllint
  tag-pattern: '^(\d+\.\d+\.\d+)$'
  version-template: '{1}'
  versioning: semver
  version: 1.38.0
  cooldown: 24h
  publisher: adrienverge/yamllint
image:
  entrypoint: [yamllint]
  cmd: [--help]
  env: {PYTHONUNBUFFERED: "1"}
test:
  - |
    yamllint --version > version.txt
    test "$(cat version.txt)" = "yamllint $VERSION"
  - |
    # yamllint exits 1 on errors, 2 on warnings with --strict and 0 otherwise.
    printf '%s\n' --- 'name: first' 'name: second' > duplicate.yaml
    rc=0; yamllint -f parsable duplicate.yaml > duplicate.txt || rc=$?
    test "$rc" = 1
    grep -qxF 'duplicate.yaml:3:1: [error] duplication of key "name" in mapping (key-duplicates)' duplicate.txt
    printf '%s\n' --- 'list: [1, 2' > broken.yaml
    rc=0; yamllint -f parsable broken.yaml > broken.txt || rc=$?
    test "$rc" = 1
    grep -q '^broken\.yaml:[0-9]*:[0-9]*: \[error\] syntax error: .* (syntax)$' broken.txt
    printf '%s\n' 'enabled: yes' > warnings.yaml
    yamllint -f parsable warnings.yaml > warnings.txt
    grep -qF '[warning] missing document start "---" (document-start)' warnings.txt
    grep -qF '[warning] truthy value should be one of [false, true] (truthy)' warnings.txt
    rc=0; yamllint --strict warnings.yaml > /dev/null || rc=$?
    test "$rc" = 2
    printf '%s\n' --- 'name: value' > clean.yaml
    yamllint --strict clean.yaml > clean.txt
    test ! -s clean.txt
  - |
    # `yamllint .` reads .yamllint from the working directory and skips the paths its gitignore-style `ignore` patterns match.
    mkdir -p project/.github/workflows project/vendor
    printf '%s\n' 'extends: default' 'ignore: |' '  vendor/' 'rules:' '  document-start: disable' '  truthy:' '    check-keys: false' > project/.yamllint
    printf '%s\n' 'on: push' 'jobs: {}' > project/.github/workflows/ci.yml
    printf '%s\n' 'a: 1' 'a: 2' > project/vendor/bad.yaml
    cd project
    yamllint --list-files . | sort > ../project-files.txt
    printf '%s\n' ./.github/workflows/ci.yml ./.yamllint | cmp - ../project-files.txt
    yamllint --strict . > ../project.txt
    test ! -s ../project.txt
    yamllint -d default -f parsable .github/workflows/ci.yml > ../project-default.txt
    grep -qF '[warning] truthy value should be one of [false, true] (truthy)' ../project-default.txt
  - |
    # Standard input, and the GitHub Actions format that auto selects when both Actions variables are set.
    printf '%s\n' --- 'key: 1' 'key: 2' > stdin.yaml
    rc=0; yamllint -f parsable - < stdin.yaml > stdin.txt || rc=$?
    test "$rc" = 1
    grep -qxF 'stdin:3:1: [error] duplication of key "key" in mapping (key-duplicates)' stdin.txt
    rc=0; GITHUB_ACTIONS=true GITHUB_WORKFLOW=lint yamllint stdin.yaml > github.txt || rc=$?
    test "$rc" = 1
    grep -qxF '::group::stdin.yaml' github.txt
    grep -qxF '::error file=stdin.yaml,line=3,col=1::3:1 [key-duplicates] duplication of key "key" in mapping' github.txt
examples:
  - title: Check every YAML file in the current directory and below
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/yamllint .
  - title: Check a file from standard input
    command: docker run --rm -i ghcr.io/randomcontainers/yamllint - < config.yaml
  - title: Fail on warnings too, with one line per problem
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/yamllint --strict -f parsable .
  - title: Report problems as GitHub Actions annotations
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/yamllint -f github .
  - title: Use the relaxed preset instead of the default rules
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/yamllint -d relaxed .
